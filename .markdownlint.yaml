# markdownlint config (https://github.com/DavidAnson/markdownlint).
# Docs here use one line per paragraph and wide tables, so line length and
# table padding are not enforced. Skills start with frontmatter plus an
# attribution quote, so the first line is not always a heading.
default: true
MD013: false # line-length
MD060: false # table-column-style
MD041: false # first-line-heading
MD033: false # inline HTML (<details>, comments)
